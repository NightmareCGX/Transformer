seed: 42

device: auto # auto | cuda | cuda:0 | mps | cpu

dtype: fp32  # fp32 | fp16 | bf16

dataset:
  train_path: /home/ezrain/PycharmProjects/Transformer/data/tinyshakespeare/train.npy
  val_path: /home/ezrain/PycharmProjects/Transformer/data/tinyshakespeare/val.npy

model:
  vocab_size: 256  #byte-level: 256, subword: 64000
  d_model: 512
  n_head: 8
  d_ff: 2048
  n_layer: 6
  batch_size: 16
  seq_len: 256
  max_len: 1024

block:
  norm: prenorm
  prenorm:
    resid_scale: none
  postnorm:
    block_dropout: 0.0
  norm_eps: 1e-5
  attn:
    bias: true
    dropout: 0.0
    out_dropout: 0.0
  ffn:
    activation: gelu
    dropout: 0.0

optim:
  name: adamw
  lr: 3e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  scheduler: noam
  max_steps: 4000
  warmup_ratio: 0.01

io:
  out_dir: out/w2_tiny
  log_interval: 10
  ckpt_interval: 500
  keep_last: 5